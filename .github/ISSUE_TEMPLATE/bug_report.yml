name: Bug report
description: Report an installation, input, graphics or audio issue
body:
  - type: markdown
    attributes:
      value: Do not attach ROMs, generated game code, saves or account tokens. Review logs for private paths.
  - type: input
    id: version
    attributes:
      label: Launcher version and Windows version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, revision and ROM SHA-256
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected / actual behavior
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: GPU, controller and relevant log excerpt
