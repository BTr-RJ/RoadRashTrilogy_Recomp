name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synthetic pipeline and installer tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit public repository contents
        run: python tools/audit_repository.py
      - name: Audit ROM-free source package
        run: |
          python tools/package_release.py --source-only --output build/ci-public
          python tools/audit_repository.py --package --root build/ci-public/RoadRashTrilogyRecomp-0.60-source
